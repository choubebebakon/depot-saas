name: Backend CI

on:
  push:
    branches: [ main, develop, 'fix/audit-corrections-phase1' ]
  pull_request:
    branches: [ main, develop, 'fix/audit-corrections-phase1' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: depot_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend-depot/package-lock.json

      - name: Install dependencies
        working-directory: backend-depot
        run: npm ci

      - name: Validate Prisma schema
        working-directory: backend-depot
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: backend-depot
        run: npx prisma generate

      - name: Run Lint
        working-directory: backend-depot
        run: npm run lint

      - name: Run Tests
        working-directory: backend-depot
        run: npm run test -- --runInBand
        env:
          DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/depot_db_test?schema=public"
          JWT_SECRET: "test_secret_ci"
          JWT_REFRESH_SECRET: "test_refresh_secret_ci"
          CAMPAY_WEBHOOK_SECRET: "test_webhook_secret"

      - name: Build Check
        working-directory: backend-depot
        run: npm run build

# Phase 1 validation: schema validation must pass before Prisma generation, tests, and build.
